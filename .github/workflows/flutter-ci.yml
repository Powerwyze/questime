name: Flutter CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter-web-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Build Android app bundle
        run: flutter build appbundle --release --dart-define=ENABLE_PUSH=false

      - name: Build installable Android test APK
        run: flutter build apk --debug --dart-define=ENABLE_PUSH=false

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: questime-android-test
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  flutter-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without codesign
        run: flutter build ios --release --no-codesign --dart-define=ENABLE_PUSH=false
